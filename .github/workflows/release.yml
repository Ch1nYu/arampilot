# Build a signed NSIS installer and a draft GitHub release when a v* tag is pushed.
# The draft becomes visible to the in-app updater only after it is published by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match tauri.conf.json version $version"
            exit 1
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --quiet

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ARAMPilot ${{ github.ref_name }}
          releaseBody: 請下載下方的 `*-setup.exe` 安裝。已安裝的使用者會在 App 裡收到更新通知。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
